changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
        - feat
    - title: Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Refactoring & Performance
      labels:
        - refactor
        - performance
        - perf
    - title: Maintenance & Dependencies
      labels:
        - dependencies
        - deps
        - chore
    - title: Other Changes
      labels:
        - '*'

